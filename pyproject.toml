[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chesslens"
version = "0.1.0"
description = "Read a mirrored iPhone chess app from an external Windows mirroring window and analyse it locally."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mss>=10",
    "numpy>=2",
    "opencv-python>=4.10",
    "PySide6>=6.7",
    "pywin32>=306; sys_platform == 'win32'",
    "chess>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
chesslens = "chesslens.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "desktop: opens real windows on the Windows desktop and captures them",
]
filterwarnings = [
    # python-chess 1.11 still uses asyncio APIs that Python 3.14 deprecates.
    "ignore::DeprecationWarning:chess.engine",
]
